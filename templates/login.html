<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zendrian Warehouse — Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            padding: 16px;
        }

        .login-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 40px 32px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-card h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: var(--text);
        }

        .login-card .subtitle {
            color: var(--text-muted);
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: var(--text);
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            font-size: 1rem;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            outline: none;
            transition: border-color 0.15s;
            background: var(--bg);
        }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .login-error {
            background: var(--error-bg);
            color: var(--error);
            padding: 10px 14px;
            border-radius: var(--radius);
            font-size: 0.9rem;
            font-weight: 500;
            border-left: 4px solid var(--error);
            text-align: left;
        }

        .login-btn {
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <h1>📦 Zendrian Warehouse</h1>
            <p class="subtitle">Sign in to continue</p>

            {% if error %}
            <div class="login-error">{{ error }}</div>
            {% endif %}

            <form method="POST" class="login-form" action="{{ url_for('auth.login') }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username"
                           autocomplete="username" autocapitalize="off"
                           required autofocus
                           placeholder="Enter your username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           autocomplete="current-password"
                           required
                           placeholder="Enter your password">
                </div>
                <button type="submit" class="btn btn-primary btn-large login-btn">
                    Sign In
                </button>
            </form>
        </div>
    </div>
</body>
</html>
