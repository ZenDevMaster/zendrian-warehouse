# ============================================================
# Zendrian Warehouse — Nginx Reverse Proxy
# Usage: docker compose -f docker-compose.nginx.yml up -d
# ============================================================

services:
  warehouse:
    image: ghcr.io/zendevmaster/zendrian-warehouse:latest
    container_name: zendrian-warehouse
    restart: unless-stopped
    volumes:
      - warehouse_data:/app/instance
    env_file:
      - .env
    networks:
      - internal
    # No ports exposed — Nginx handles external traffic
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/login"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: zendrian-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - internal
    depends_on:
      warehouse:
        condition: service_healthy

volumes:
  warehouse_data:
    driver: local

networks:
  internal:
    driver: bridge
