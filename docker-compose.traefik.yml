# ============================================================
# Zendrian Warehouse — Traefik Reverse Proxy
# Usage: docker compose -f docker-compose.traefik.yml up -d
# ============================================================

services:
  traefik:
    image: traefik:v3.4
    container_name: zendrian-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"   # Dashboard (disable in production or protect with auth)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    command:
      # API / Dashboard
      #- "--api.dashboard=true"
      #- "--api.insecure=true"          # Remove in production; use auth middleware instead
      # Docker provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Let's Encrypt ACME
      - "--certificatesresolvers.letsencrypt.acme.email=admin@example.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"

  warehouse:
    image: ghcr.io/zendevmaster/zendrian-warehouse:latest
    container_name: zendrian-warehouse
    restart: unless-stopped
    volumes:
      - warehouse_data:/app/instance
    env_file:
      - .env
    networks:
      - proxy
    depends_on:
      - traefik
    labels:
      - "traefik.enable=true"
      # HTTP Router
      - "traefik.http.routers.warehouse.rule=Host(`warehouse.example.com`)"
      - "traefik.http.routers.warehouse.entrypoints=websecure"
      - "traefik.http.routers.warehouse.tls=true"
      - "traefik.http.routers.warehouse.tls.certresolver=letsencrypt"
      # Service
      - "traefik.http.services.warehouse.loadbalancer.server.port=8000"
      # Optional: HTTP to HTTPS redirect
      - "traefik.http.routers.warehouse-http.rule=Host(`warehouse.example.com`)"
      - "traefik.http.routers.warehouse-http.entrypoints=web"
      - "traefik.http.routers.warehouse-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/login"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  warehouse_data:
    driver: local
  letsencrypt:
    driver: local

networks:
  proxy:
    driver: bridge
