# ============================================================
# Zendrian Warehouse — Traefik Reverse Proxy
# Usage: docker compose -f docker-compose.traefik.yml up -d
# Prerequisites: Traefik running on the "proxy" network
# ============================================================

services:
  warehouse:
    image: ghcr.io/zendevmaster/zendrian-warehouse:latest
    container_name: zendrian-warehouse
    restart: unless-stopped
    volumes:
      - warehouse_data:/app/instance
    env_file:
      - .env
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      # HTTP Router
      - "traefik.http.routers.warehouse.rule=Host(`warehouse.example.com`)"
      - "traefik.http.routers.warehouse.entrypoints=websecure"
      - "traefik.http.routers.warehouse.tls=true"
      - "traefik.http.routers.warehouse.tls.certresolver=letsencrypt"
      # Service
      - "traefik.http.services.warehouse.loadbalancer.server.port=8000"
      # Optional: HTTP to HTTPS redirect
      - "traefik.http.routers.warehouse-http.rule=Host(`warehouse.example.com`)"
      - "traefik.http.routers.warehouse-http.entrypoints=web"
      - "traefik.http.routers.warehouse-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/login"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  warehouse_data:
    driver: local

networks:
  proxy:
    external: true
